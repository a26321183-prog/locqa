[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "locqa"
version = "1.0.0"
description = "QA for Flutter ARB localisation files (Kazakh and Uzbek first-class)"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
locqa = "locqa.cli:main"

[tool.setuptools]
packages = ["locqa"]
